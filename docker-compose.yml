# Local development. Values come from .env (copy .env.example first).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: cinder
      POSTGRES_DB: cinder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinder -d cinder"]
      interval: 2s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://cinder:${POSTGRES_PASSWORD}@db:5432/cinder
    ports:
      - "${PORT:-3000}:3000"
    profiles: ["app"]

volumes:
  pgdata:
